name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
          runtime: node@24

      - name: Select release mode
        id: changesets
        uses: changesets/action/select-mode@v2

  version:
    name: Prepare package versions
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
          runtime: node@24

      - name: Create or update the version pull request
        uses: changesets/action/version@v2
        with:
          script: pnpm version-packages
          commit-message: "build: package versions follow their changesets"
          pr-title: "build: package versions follow their changesets"

  publish:
    name: Publish packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
          runtime: node@24

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          script: pnpm release
          create-github-releases: true
